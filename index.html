<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Workspace Copilot</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- ヘッダー -->
  <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white text-xl font-bold shadow-md shadow-indigo-100">
        🤖
      </div>
      <h1 class="text-xl font-bold text-slate-900">AI Workspace Copilot</h1>
    </div>
    
    <div>
      <button id="login-btn" class="px-4 py-2 bg-white text-slate-700 font-medium text-sm border border-slate-300 rounded-lg shadow-sm hover:bg-slate-50 flex items-center gap-2 transition-all">
        <svg class="w-4 h-4" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Googleで連携する
      </button>
      <div id="login-badge" class="hidden px-4 py-2 text-sm font-medium text-green-700 bg-green-100 rounded-lg border border-green-300 flex items-center gap-2 shadow-sm">
        ✓ Google連携済み
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-1 p-6 max-w-7xl mx-auto w-full flex flex-col gap-6">
    
    <!-- お題目カード -->
    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
      <div>
        <span class="inline-block px-3 py-1 bg-indigo-50 text-indigo-600 text-xs font-semibold rounded-full mb-2">今日のお議題</span>
        <h2 class="text-xl font-bold text-slate-900">AIを使った未来の学校のアイデアを考えよう</h2>
      </div>
      <div class="px-4 py-2 bg-slate-100 text-slate-600 rounded-lg text-sm font-medium border border-slate-200">
        指定ツール: <span class="font-bold text-slate-800">Google Docs</span>
      </div>
    </div>

    <!-- 左右分割ワークスペース -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 flex-1 min-h-[550px]">
      
      <!-- 左：作業スペース (Google Docs iframe) -->
      <div class="bg-white border border-slate-200 rounded-2xl flex flex-col overflow-hidden shadow-sm">
        <div class="bg-slate-50 px-4 py-3 border-b border-slate-200 flex justify-between items-center text-sm font-medium text-slate-600">
          <span>📝 作業スペース</span>
          <span class="text-xs text-slate-400">編集可能</span>
        </div>
        <div class="flex-1 bg-slate-100 relative">
          <iframe id="workspace-frame" class="w-full h-full border-0 absolute inset-0" src="about:blank"></iframe>
        </div>
      </div>

      <!-- 右：AI チャットエリア -->
      <div class="bg-white border border-slate-200 rounded-2xl flex flex-col overflow-hidden shadow-sm">
        <div class="bg-slate-50 px-4 py-3 border-b border-slate-200 text-sm font-medium text-slate-600 flex items-center gap-2">
          <span>💡 AI アシスタント</span>
        </div>
        
        <!-- チャット履歴 -->
        <div id="chat-history" class="flex-1 p-4 overflow-y-auto space-y-4">
          <div class="flex flex-col items-start">
            <div class="max-w-[85%] p-3.5 text-sm leading-relaxed rounded-2xl bg-indigo-50 text-indigo-900 border border-indigo-100 rounded-tl-none">
              こんにちは！AIアシスタントです。アイデア出しや文章作成のサポートをします。何でも気軽に質問してくださいね。
            </div>
          </div>
        </div>

        <!-- 入力フォーム -->
        <form id="chat-form" class="p-4 border-t border-slate-200 flex gap-2">
          <input 
            type="text" 
            id="chat-input" 
            placeholder="メッセージを入力..." 
            class="flex-1 px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all"
            required
          >
          <button 
            type="submit" 
            class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm rounded-xl shadow-sm transition-all flex items-center justify-center"
          >
            送信
          </button>
        </form>

      </div>

    </div>

  </main>

  <!-- Firebase & スクリプト -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
const firebaseConfig = {
apiKey: "AIzaSyC8nYLbZ0MNbnC_hfJ9uJirlaYGWnOMSBY",
authDomain: "kouritsuapp-f4431.firebaseapp.com",
projectId: "kouritsuapp-f4431",
storageBucket: "kouritsuapp-f4431.firebasestorage.app",
messagingSenderId: "1006332335773",
appId: "1:1006332335773:web:48c1fce80f67a099426674",
measurementId: "G-S2YZN1CWLF"
};

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const loginBtn = document.getElementById('login-btn');
    const loginBadge = document.getElementById('login-badge');
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');
    const chatHistory = document.getElementById('chat-history');
    const iframe = document.getElementById('workspace-frame');
    const docsEmbedUrl = "https://docs.google.com/document/create?embedded=true";

    // ログイン状態監視
    onAuthStateChanged(auth, (user) => {
      if (user) {
        console.log("ログイン中:", user.displayName);
        if (loginBtn) loginBtn.classList.add('hidden');
        if (loginBadge) loginBadge.classList.remove('hidden');
        if (iframe && (!iframe.src || iframe.src === 'about:blank' || iframe.src === window.location.href)) {
          iframe.src = docsEmbedUrl;
        }
      } else {
        if (loginBtn) loginBtn.classList.remove('hidden');
        if (loginBadge) loginBadge.classList.add('hidden');
      }
    });

    // Googleポップアップログイン
    if (loginBtn) {
      loginBtn.onclick = async () => {
        try {
          await signInWithPopup(auth, provider);
        } catch (error) {
          console.error("ログインエラー:", error);
        }
      };
    }

    // AIチャット送信＆Firestore保存
    chatForm?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = chatInput.value.trim();
      if (!message) return;

      appendMessage(message, 'user');
      chatInput.value = '';

      try {
        const res = await fetch('https://kouritapp.onrender.com/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'AIサーバーでエラーが発生しました');
        
        appendMessage(data.reply || "応答を取得できませんでした。", 'ai');

        // ログイン済みであればFirestoreに保存
        if (auth.currentUser) {
          await addDoc(collection(db, "tasks"), {
            uid: auth.currentUser.uid,
            prompt: message,
            reply: data.reply,
            createdAt: serverTimestamp()
          });
        }
      } catch (err) {
        console.error("API Error:", err);
        appendMessage(`通信エラー: ${err.message}`, 'ai');
      }
    });

    function appendMessage(text, sender) {
      const isUser = sender === 'user';
      const wrapper = document.createElement('div');
      wrapper.className = `flex flex-col items-${isUser ? 'end' : 'start'}`;
      
      const msgDiv = document.createElement('div');
      msgDiv.className = `max-w-[85%] p-3.5 text-sm leading-relaxed rounded-2xl ${
        isUser 
          ? 'bg-indigo-600 text-white rounded-tr-none shadow-sm shadow-indigo-100' 
          : 'bg-indigo-50 text-indigo-900 border border-indigo-100 rounded-tl-none'
      }`;
      msgDiv.textContent = text;
      
      wrapper.appendChild(msgDiv);
      chatHistory.appendChild(wrapper);
      chatHistory.scrollTop = chatHistory.scrollHeight;
    }
  </script>
</body>
</html>
