<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 学習コパイロット - For Students</title>
    <!-- Tailwind CSS & Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'M PLUS Rounded 1c', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-sky-50 to-emerald-50 min-h-screen flex flex-col text-slate-800">

    <!-- Header -->
    <header class="glass-panel border-b border-white/50 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-500 to-indigo-600 flex items-center justify-center text-white shadow-lg shadow-blue-500/30">
                    <i class="fa-solid fa-graduation-cap text-lg"></i>
                </div>
                <h1 class="font-bold text-xl tracking-tight text-slate-800">AI 学習コパイロット</h1>
            </div>
            <div class="flex items-center gap-3">
                <span id="firebaseStatus" class="px-3 py-1 bg-amber-100 text-amber-700 text-xs font-bold rounded-full border border-amber-200">
                    <i class="fa-solid fa-database mr-1"></i> Firebase 接続中...
                </span>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Left Column: Teacher Task & Specified Tool (Col: 7) -->
        <div class="lg:col-span-7 flex flex-col gap-6">
            
            <!-- 1. 先生からのお題 (Firebase連携) -->
            <div class="glass-panel border border-white rounded-3xl p-6 shadow-xl shadow-slate-200/50 relative overflow-hidden">
                <div class="absolute top-0 left-0 w-2 h-full bg-blue-500"></div>
                <div class="flex items-center justify-between mb-3">
                    <h2 class="font-bold text-lg text-blue-900 flex items-center gap-2">
                        <i class="fa-solid fa-flag text-blue-500"></i>
                        <span>今日のお題</span>
                    </h2>
                    <!-- 指定ツールのバッジ表示 -->
                    <div id="toolBadge" class="hidden px-3 py-1 bg-indigo-100 text-indigo-700 font-bold text-xs rounded-full border border-indigo-200 items-center gap-1.5">
                        <i id="toolIcon" class="fa-solid fa-screwdriver-wrench"></i>
                        <span id="toolName">指定ツール</span>
                    </div>
                </div>

                <!-- お題本文 -->
                <div id="task-content" class="text-slate-700 leading-relaxed bg-blue-50/50 p-4 rounded-2xl border border-blue-100 font-medium text-base">
                    <i class="fa-solid fa-spinner fa-spin text-blue-400"></i> Firebaseから今日のお題を読み込んでいます...
                </div>
            </div>

            <!-- 2. 指定ツール／作業スペース -->
            <div class="glass-panel border border-white rounded-3xl p-6 shadow-xl shadow-slate-200/50 flex-1 flex flex-col min-h-[400px]">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="font-bold text-slate-700 flex items-center gap-2">
                        <i class="fa-solid fa-laptop-code text-indigo-400"></i> 作業ノート（提出作成用）
                    </h3>
                    <span id="toolInstruction" class="text-xs text-slate-400">指定された方法でまとめてみよう</span>
                </div>
                <textarea class="flex-1 w-full bg-slate-50/50 border border-slate-200 rounded-2xl p-5 resize-none focus:outline-none focus:ring-2 focus:ring-indigo-400/50 transition-all custom-scrollbar text-slate-700 text-lg leading-loose shadow-inner" placeholder="AIと一緒に考えたアイデアや、お題の回答をここに書き込もう！"></textarea>
            </div>
            
        </div>

        <!-- Right Column: AI Chat (Col: 5) -->
        <div class="lg:col-span-5 flex flex-col glass-panel border border-white rounded-3xl shadow-xl shadow-slate-200/50 overflow-hidden h-[calc(100vh-120px)]">
            
            <div class="bg-gradient-to-r from-indigo-500 to-blue-600 px-6 py-4 flex items-center justify-between shadow-md z-10">
                <h3 class="font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-robot text-indigo-100 text-xl"></i> AI メンター
                </h3>
            </div>
            
            <!-- Chat Feed -->
            <div id="chatBox" class="flex-1 p-6 overflow-y-auto custom-scrollbar flex flex-col gap-6 bg-slate-50/30">
                <div class="flex gap-4 items-start">
                    <div class="w-10 h-10 rounded-2xl bg-indigo-500 flex items-center justify-center text-white shrink-0 shadow-lg shadow-indigo-500/30 transform -rotate-3">
                        <i class="fa-solid fa-robot text-lg"></i>
                    </div>
                    <div class="bg-white border border-slate-100 p-4 rounded-3xl rounded-tl-sm shadow-md text-slate-700 max-w-[85%] leading-relaxed">
                        こんにちは！今日のお題で分からないことや、アイデアの出し方に迷ったら何でも相談してね！
                    </div>
                </div>
            </div>
            
            <!-- Input Area -->
            <div class="p-4 bg-white/80 backdrop-blur border-t border-slate-100">
                <div class="flex gap-2 relative">
                    <input type="text" id="userInput" class="flex-1 bg-slate-100 border border-slate-200 rounded-full pl-5 pr-14 py-3.5 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:bg-white transition-all text-slate-700" placeholder="AIに質問・相談する...">
                    <button id="sendBtn" class="absolute right-2 top-1.5 w-10 h-10 rounded-full bg-indigo-600 hover:bg-indigo-700 text-white flex items-center justify-center transition-all shadow-md active:scale-95">
                        <i class="fa-solid fa-paper-plane text-sm"></i>
                    </button>
                </div>
            </div>
            
        </div>
    </main>

    <!-- Firebase & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // 1. Firebaseの設定
        const firebaseConfig = {
  apiKey: "AIzaSyAS6jKvmRaEMyrobj3kFTHLdxlw1zWsKdQ",
  authDomain: "kouritsuapp-f4431.firebaseapp.com",
  projectId: "kouritsuapp-f4431",
  storageBucket: "kouritsuapp-f4431.firebasestorage.app",
  messagingSenderId: "1006332335773",
  appId: "1:1006332335773:web:48c1fce80f67a099426674",
  measurementId: "G-S2YZN1CWLF"
        };

        // 2. RenderのAPI設定
        const RENDER_API_URL = "https://kouritapp.onrender.com/api/chat";

        let db;
        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
        } catch(e) { console.error("Firebase Error:", e); }

        // Firebaseからお題と指定ツールを取得する処理
        async function fetchTeacherTask() {
            if (!db) return;
            try {
                // "tasks" コレクションからデータを取得
                const q = query(collection(db, "tasks"), limit(1));
                const querySnapshot = await getDocs(q);
                
                const statusBadge = document.getElementById('firebaseStatus');
                
                if (!querySnapshot.empty) {
                    const data = querySnapshot.docs[0].data();
                    
                    // お題テキストの反映
                    document.getElementById('task-content').textContent = data.topic || data.title || "お題が設定されていません";
                    
                    // 指定ツールの反映 (例: "Google Doc", "Spreadsheet", "キャンバスノート" など)
                    const tool = data.tool || "ノート";
                    const toolBadge = document.getElementById('toolBadge');
                    const toolName = document.getElementById('toolName');
                    const toolIcon = document.getElementById('toolIcon');

                    toolName.textContent = `指定ツール: ${tool}`;
                    toolBadge.classList.remove('hidden');
                    toolBadge.classList.add('flex');

                    // アイコンの設定
                    if (tool.includes("Doc") || tool.includes("ドキュメント")) {
                        toolIcon.className = "fa-solid fa-file-word text-blue-500";
                    } else if (tool.includes("Sheet") || tool.includes("シート")) {
                        toolIcon.className = "fa-solid fa-file-excel text-emerald-500";
                    } else if (tool.includes("Slide") || tool.includes("スライド")) {
                        toolIcon.className = "fa-solid fa-file-powerpoint text-amber-500";
                    } else {
                        toolIcon.className = "fa-solid fa-pen-to-square text-indigo-500";
                    }
                    
                    statusBadge.className = "px-3 py-1 bg-emerald-100 text-emerald-700 text-xs font-bold rounded-full border border-emerald-200";
                    statusBadge.innerHTML = '<i class="fa-solid fa-database mr-1"></i> Firebase 接続済';
                } else {
                    document.getElementById('task-content').textContent = "現在、先生からの新しいお題はありません。";
                }
            } catch (error) {
                console.error("Firebase Fetch Error:", error);
                document.getElementById('task-content').textContent = "お題の読み込みに失敗しました。Firebaseの設定（ルール等）を確認してください。";
            }
        }

        // チャット処理
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        function appendMessage(text, type) {
            const wrapper = document.createElement('div');
            if (type === 'user') {
                wrapper.className = "flex gap-4 items-start flex-row-reverse";
                wrapper.innerHTML = `
                    <div class="w-10 h-10 rounded-2xl bg-blue-500 flex items-center justify-center text-white shrink-0 shadow-lg shadow-blue-500/30 transform rotate-3"><i class="fa-solid fa-user text-lg"></i></div>
                    <div class="bg-blue-600 text-white p-4 rounded-3xl rounded-tr-sm shadow-md max-w-[85%] leading-relaxed">${text}</div>`;
            } else {
                wrapper.className = "flex gap-4 items-start";
                wrapper.innerHTML = `
                    <div class="w-10 h-10 rounded-2xl bg-indigo-500 flex items-center justify-center text-white shrink-0 shadow-lg shadow-indigo-500/30 transform -rotate-3"><i class="fa-solid fa-robot text-lg"></i></div>
                    <div class="bg-white border border-slate-100 p-4 rounded-3xl rounded-tl-sm shadow-md text-slate-700 max-w-[85%] leading-relaxed">${text}</div>`;
            }
            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function handleSend() {
            const text = userInput.value.trim();
            if (!text) return;
            appendMessage(text, 'user');
            userInput.value = '';

            try {
                const response = await fetch(RENDER_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();
                appendMessage(data.reply || data.response || "応答を受け取りました", 'ai');
            } catch (error) {
                appendMessage("Renderサーバーとの通信に失敗しました。", 'ai');
            }
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSend(); });
        window.addEventListener('DOMContentLoaded', fetchTeacherTask);
    </script>
</body>
</html>
