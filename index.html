<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Workspace Copilot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ブラウザ全体のスクロールを無効化し、アプリ感のある全画面配置にする */
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 flex flex-col h-screen w-screen">

  <!-- ヘッダー（高さ固定） -->
  <header class="bg-white border-b border-slate-200 px-6 py-2.5 flex justify-between items-center shrink-0 shadow-sm z-10">
    <div class="flex items-center space-x-3">
      <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold text-lg">
        🤖
      </div>
      <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-purple-600">
        AI Workspace Copilot
      </h1>
    </div>
    <div id="auth-status" class="flex items-center gap-3">
      <button id="login-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-4 py-2 rounded-lg font-medium transition-colors">
        Googleで連携する
      </button>
      <span id="login-badge" class="hidden text-xs bg-emerald-100 text-emerald-700 px-3 py-1.5 rounded-full font-medium flex items-center gap-1">
        ✓ Google連携済み
      </span>
    </div>
  </header>

  <!-- メインコンテンツ（余白をゼロにして全画面を最大活用） -->
  <main class="flex-1 flex overflow-hidden p-2 gap-2 h-[calc(100vh-57px)] w-full">
    
    <!-- 左パネル：お題 ＋ 作業スペース（画面幅の 70%） -->
    <section class="w-[70%] flex flex-col bg-white rounded-lg border border-slate-200 shadow-sm overflow-hidden h-full">
      
      <!-- お題ヘッダー（薄型化） -->
      <div class="px-4 py-2 bg-slate-50 border-b border-slate-200 shrink-0 flex justify-between items-center">
        <div class="flex items-center gap-3">
          <span class="text-xs font-semibold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded border border-indigo-100">
            今日のお題
          </span>
          <h2 id="topic-title" class="text-sm font-bold text-slate-800">
            AIを使った未来の学校のアイデアを考えよう
          </h2>
        </div>
        <div class="text-xs text-slate-500 bg-white border border-slate-200 px-2 py-0.5 rounded">
          指定ツール: <span id="tool-name" class="font-semibold text-slate-700">Google Docs</span>
        </div>
      </div>

      <!-- 作業スペース（iframeを最大表示） -->
      <div class="flex-1 relative bg-slate-200 w-full h-full">
        <iframe 
          id="workspace-frame"
          src="" 
          class="w-full h-full border-0 absolute inset-0"
          allow="autoplay"
        ></iframe>
      </div>

    </section>

    <!-- 右パネル：AI メンター チャット（画面幅の 30%） -->
    <section class="w-[30%] flex flex-col bg-white rounded-lg border border-slate-200 shadow-sm overflow-hidden h-full min-w-[300px]">
      
      <!-- チャットヘッダー -->
      <div class="px-4 py-2.5 bg-slate-50 border-b border-slate-200 shrink-0 flex items-center justify-between">
        <h3 class="font-bold text-slate-700 text-sm flex items-center gap-2">
          💡 AI メ mentor チャット
        </h3>
      </div>

      <!-- チャット履歴エリア -->
      <div id="chat-history" class="flex-1 p-3 overflow-y-auto space-y-3 bg-slate-50/50">
        <div class="flex flex-col items-start">
          <div class="max-w-[90%] bg-indigo-50 text-indigo-900 border border-indigo-100 rounded-2xl rounded-tl-none p-3 text-sm leading-relaxed">
            こんにちは！今日のお題について分からないことやアイデアの相談があれば何でも聞いてね！
          </div>
        </div>
      </div>

      <!-- メッセージ入力エリア -->
      <div class="p-2.5 bg-white border-t border-slate-200 shrink-0">
        <form id="chat-form" class="flex gap-2">
          <input 
            type="text" 
            id="chat-input"
            placeholder="AIに質問してみよう..."
            class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
          >
          <button 
            type="submit"
            class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2 rounded-lg text-sm transition-colors shrink-0"
          >
            送信
          </button>
        </form>
      </div>

    </section>

  </main>

  <!-- Firebase & App Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "ai-base-513801.firebaseapp.com",
      projectId: "ai-base-513801",
      storageBucket: "ai-base-513801.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    provider.addScope('https://www.googleapis.com/auth/drive.file');
    provider.addScope('https://www.googleapis.com/auth/documents');
    provider.addScope('https://www.googleapis.com/auth/spreadsheets');

    const loginBtn = document.getElementById('login-btn');
    const loginBadge = document.getElementById('login-badge');
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');
    const chatHistory = document.getElementById('chat-history');
    const iframe = document.getElementById('workspace-frame');

    loginBtn?.addEventListener('click', async () => {
      try {
        const result = await signInWithPopup(auth, provider);
        if (result?.user) {
          iframe.src = `https://docs.google.com/document/u/0/?t=${Date.now()}`;
        }
      } catch (error) {
        console.error("Login Error:", error);
      }
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginBtn?.classList.add('hidden');
        loginBadge?.classList.remove('hidden');
        if (!iframe.src || iframe.src === 'about:blank') {
          iframe.src = `https://docs.google.com/document/u/0/?t=${Date.now()}`;
        }
      } else {
        loginBtn?.classList.remove('hidden');
        loginBadge?.classList.add('hidden');
      }
    });

    chatForm?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = chatInput.value.trim();
      if (!message) return;

      appendMessage(message, 'user');
      chatInput.value = '';

      try {
        const res = await fetch('https://kouritapp.onrender.com/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message })
        });
        const data = await res.json();
        appendMessage(data.reply || "応答を取得できませんでした。", 'ai');

        if (auth.currentUser) {
          await addDoc(collection(db, "tasks"), {
            uid: auth.currentUser.uid,
            prompt: message,
            reply: data.reply,
            createdAt: serverTimestamp()
          });
        }
      } catch (err) {
        console.error("API Error:", err);
        appendMessage("通信エラーが発生しました。", 'ai');
      }
    });

    function appendMessage(text, sender) {
      const isUser = sender === 'user';
      const wrapper = document.createElement('div');
      wrapper.className = `flex flex-col items-${isUser ? 'end' : 'start'}`;
      
      const msgDiv = document.createElement('div');
      msgDiv.className = `max-w-[90%] p-3 text-sm leading-relaxed rounded-2xl ${
        isUser 
          ? 'bg-indigo-600 text-white rounded-tr-none' 
          : 'bg-indigo-50 text-indigo-900 border border-indigo-100 rounded-tl-none'
      }`;
      msgDiv.textContent = text;

      wrapper.appendChild(msgDiv);
      chatHistory.appendChild(wrapper);
      chatHistory.scrollTop = chatHistory.scrollHeight;
    }
  </script>

</body>
</html>
