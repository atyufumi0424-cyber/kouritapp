<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Workspace Copilot</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

  <div class="max-w-6xl mx-auto p-4 md:p-6 space-y-4">
    
    <!-- ヘッダー -->
    <header class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white font-bold text-xl shadow-md shadow-indigo-200">
          🤖
        </div>
        <div>
          <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-purple-600">
            AI Workspace Copilot
          </h1>
        </div>
      </div>
      
      <div id="auth-status">
        <!-- ログイン前：Google標準アイコン付きボタン -->
        <button id="login-btn" class="bg-white hover:bg-slate-50 text-slate-700 font-medium text-sm px-4 py-2 rounded-xl border border-slate-300 shadow-sm transition-all flex items-center gap-2">
          <svg class="w-4 h-4" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          Googleで連携する
        </button>

        <!-- ログイン後：緑バッジ -->
        <span id="login-badge" class="hidden text-xs bg-emerald-100 text-emerald-700 px-3.5 py-2 rounded-xl font-medium items-center gap-1.5 border border-emerald-200">
          ✓ Google連携済み
        </span>
      </div>
    </header>

    <!-- メインコンテンツ（左右分割カード） -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
      
      <!-- 左：作業スペース（Docs / Sheets） -->
      <div class="lg:col-span-7 space-y-4">
        
        <!-- お題カード -->
        <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-sm flex items-center justify-between">
          <div class="space-y-1">
            <span class="text-[10px] font-bold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full border border-indigo-100">
              今日のお題
            </span>
            <h2 id="topic-title" class="text-base font-bold text-slate-800">
              AIを使った未来の学校のアイデアを考えよう
            </h2>
          </div>
          <div class="text-xs text-slate-500 bg-slate-50 border border-slate-200 px-3 py-1 rounded-lg">
            指定ツール: <span id="tool-name" class="font-semibold text-slate-700">Google Docs</span>
          </div>
        </div>

        <!-- Google Workspace 作業エリア -->
        <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
          <div class="p-3 bg-slate-50/80 border-b border-slate-200 flex justify-between items-center text-xs text-slate-500 font-medium">
            <span>📝 作業スペース</span>
            <span class="text-slate-400">編集可能</span>
          </div>
          <div class="relative w-full bg-slate-100" style="height: 520px;">
            <iframe 
              id="workspace-frame"
              src="" 
              class="w-full h-full border-0"
              allow="autoplay"
            ></iframe>
          </div>
        </div>

      </div>

      <!-- 右：AI メンター チャット -->
      <div class="lg:col-span-5">
        <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden flex flex-col" style="height: 610px;">
          
          <div class="p-4 bg-slate-50/80 border-b border-slate-200 shrink-0">
            <h3 class="font-bold text-slate-700 text-sm flex items-center gap-2">
              💡 AI メンター チャット
            </h3>
          </div>

          <!-- チャット履歴 -->
          <div id="chat-history" class="flex-1 p-4 overflow-y-auto space-y-3 bg-slate-50/30">
            <div class="flex flex-col items-start">
              <div class="max-w-[85%] bg-indigo-50 text-indigo-900 border border-indigo-100 rounded-2xl rounded-tl-none p-3.5 text-sm leading-relaxed">
                こんにちは！今日のお題について分からないことやアイデアの相談があれば何でも聞いてね！
              </div>
            </div>
          </div>

          <!-- メッセージ入力フォーム -->
          <div class="p-3 bg-white border-t border-slate-200 shrink-0">
            <form id="chat-form" class="flex gap-2">
              <input 
                type="text" 
                id="chat-input"
                placeholder="AIに質問してみよう..."
                class="flex-1 border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent bg-slate-50/50"
              >
              <button 
                type="submit"
                class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2.5 rounded-xl text-sm transition-colors shadow-sm shadow-indigo-200 shrink-0"
              >
                送信
              </button>
            </form>
          </div>

        </div>
      </div>

    </div>

  </div>

  <!-- Firebase & App Scripts -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      GoogleAuthProvider, 
      signInWithRedirect, 
      getRedirectResult, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
  apiKey: "AIzaSyC8nYLbZ0MNbnC_hfJ9uJirlaYGWnOMSBY",
  authDomain: "kouritsuapp-f4431.firebaseapp.com",
  projectId: "kouritsuapp-f4431",
  storageBucket: "kouritsuapp-f4431.firebasestorage.app",
  messagingSenderId: "1006332335773",
  appId: "1:1006332335773:web:48c1fce80f67a099426674",
  measurementId: "G-S2YZN1CWLF"
    };

const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);
      const provider = new GoogleAuthProvider();
      provider.addScope('https://www.googleapis.com/auth/drive.file');
      provider.addScope('https://www.googleapis.com/auth/documents');
      provider.addScope('https://www.googleapis.com/auth/spreadsheets');

      // DOM要素の取得（宣言は1箇所のみ）
      const loginBtn = document.getElementById('login-btn') || document.querySelector('button');
      const loginBadge = document.getElementById('login-badge');
      const iframe = document.getElementById('workspace-frame');
      const docsEmbedUrl = "https://docs.google.com/document/create?embedded=true";

      // 1. ログインボタン押下時の処理
      if (loginBtn) {
        loginBtn.onclick = () => {
          signInWithRedirect(auth, provider);
        };
      }

      // 2. ログイン状態の自動監視とUI切替
      onAuthStateChanged(auth, (user) => {
        if (user) {
          console.log("ログイン中のユーザー:", user);
          if (loginBtn) {
            loginBtn.innerText = '✓ Google連携済み';
            loginBtn.className = 'px-4 py-2 text-sm font-medium text-green-700 bg-green-100 rounded-lg border border-green-300 flex items-center gap-2 shadow-sm';
          }
          if (loginBadge) loginBadge.classList.remove('hidden');
          if (iframe && (!iframe.src || iframe.src === 'about:blank')) {
            iframe.src = docsEmbedUrl;
          }
        }
      });

      // 3. リダイレクト結果の処理
      getRedirectResult(auth)
        .then((result) => {
          if (result) {
            console.log("リダイレクト成功:", result.user);
          }
        })
        .catch((error) => {
          console.error("リダイレクトエラー:", error);
        });


    // 4. AI チャット送信処理
    chatForm?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = chatInput.value.trim();
      if (!message) return;

      appendMessage(message, 'user');
      chatInput.value = '';

      try {
        const res = await fetch('https://kouritapp.onrender.com/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message })
        });
        
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'AIサーバーでエラーが発生しました');
        }

        appendMessage(data.reply || "応答を取得できませんでした。", 'ai');

        if (auth.currentUser) {
          await addDoc(collection(db, "tasks"), {
            uid: auth.currentUser.uid,
            prompt: message,
            reply: data.reply,
            createdAt: serverTimestamp()
          });
        }
      } catch (err) {
        console.error("API Error:", err);
        appendMessage(`通信エラー: ${err.message}`, 'ai');
      }
    });

    function appendMessage(text, sender) {
      const isUser = sender === 'user';
      const wrapper = document.createElement('div');
      wrapper.className = `flex flex-col items-${isUser ? 'end' : 'start'}`;
      
      const msgDiv = document.createElement('div');
      msgDiv.className = `max-w-[85%] p-3.5 text-sm leading-relaxed rounded-2xl ${
        isUser 
          ? 'bg-indigo-600 text-white rounded-tr-none shadow-sm shadow-indigo-100' 
          : 'bg-indigo-50 text-indigo-900 border border-indigo-100 rounded-tl-none'
      }`;
      msgDiv.textContent = text;

      wrapper.appendChild(msgDiv);
      chatHistory.appendChild(wrapper);
      chatHistory.scrollTop = chatHistory.scrollHeight;
    }
  </script>


</body>
</html>
