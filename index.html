<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 学習コパイロット</title>
    <!-- 見た目をきれいにするためのツール (Tailwind CSS & FontAwesome) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">
    
    <!-- ヘッダー -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 p-4 shadow-sm">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <h1 class="font-bold text-xl text-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-graduation-cap text-blue-500"></i>
                AI 学習コパイロット
            </h1>
            <span class="text-sm font-medium text-slate-500 bg-slate-100 px-3 py-1 rounded-full">先生のタスク × AIサポート</span>
        </div>
    </header>

    <!-- メイン画面（左右に分かれるレイアウト） -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <!-- 左側：タスク表示と作業ノート -->
        <div class="flex flex-col gap-4">
            
            <!-- 先生からのタスク -->
            <div class="bg-blue-50 border-l-4 border-blue-500 p-4 rounded-r-lg shadow-sm">
                <h2 class="font-bold text-blue-800 mb-2 flex items-center gap-2">
                    <i class="fa-solid fa-clipboard-list"></i> 先生からのタスク
                </h2>
                <p class="text-sm text-blue-900 leading-relaxed font-medium">
                    今日の目標：<br>
                    「地球温暖化の主な原因」について調べ、右側のAIと相談しながら、下のノートに自分の言葉でまとめましょう。
                </p>
            </div>
            
            <!-- 作業ノート -->
            <div class="flex-1 flex flex-col bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden min-h-[400px]">
                <div class="bg-slate-100 px-4 py-2 border-b border-slate-200 font-semibold text-slate-700 text-sm flex items-center gap-2">
                    <i class="fa-solid fa-book-open"></i> 作業用ノート
                </div>
                <textarea class="flex-1 p-4 w-full resize-none focus:outline-none focus:ring-2 focus:ring-blue-200 custom-scrollbar text-slate-700 leading-relaxed" placeholder="調べたことや、AIと話してわかったことをここに書いていこう！"></textarea>
            </div>
            
        </div>

        <!-- 右側：AIチャットアシスタント -->
        <div class="flex flex-col bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden h-[80vh]">
            <div class="bg-indigo-50 px-4 py-3 border-b border-indigo-100 font-semibold text-indigo-800 text-sm flex items-center gap-2">
                <i class="fa-solid fa-robot"></i> AI アシスタント
            </div>
            
            <!-- チャット履歴が表示される場所 -->
            <div id="chatBox" class="flex-1 p-4 overflow-y-auto custom-scrollbar flex flex-col gap-4 bg-slate-50">
                <!-- 最初のAIの挨拶 -->
                <div class="flex gap-3">
                    <div class="w-8 h-8 rounded-full bg-indigo-500 flex items-center justify-center text-white shrink-0 shadow-sm">
                        <i class="fa-solid fa-robot text-sm"></i>
                    </div>
                    <div class="bg-white border border-slate-200 p-3 rounded-2xl rounded-tl-none shadow-sm text-sm text-slate-700 max-w-[85%] leading-relaxed">
                        こんにちは！今日のタスクで分からないことや、まとめ方のアイデアが欲しい時はなんでも聞いてね。
                    </div>
                </div>
            </div>
            
            <!-- メッセージ入力欄 -->
            <div class="p-3 bg-white border-t border-slate-200 flex gap-2">
                <input type="text" id="userInput" class="flex-1 bg-slate-100 border-none rounded-full px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300" placeholder="AIに質問してみよう..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()" class="w-10 h-10 rounded-full bg-indigo-500 hover:bg-indigo-600 text-white flex items-center justify-center transition shadow-sm">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>

    </main>

    <!-- チャットを動かすプログラム -->
    <script>
        function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            const chatBox = document.getElementById('chatBox');
            
            // 自分が入力したメッセージを画面に追加
            chatBox.innerHTML += `
                <div class="flex gap-3 flex-row-reverse">
                    <div class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center text-white shrink-0 shadow-sm">
                        <i class="fa-solid fa-user text-sm"></i>
                    </div>
                    <div class="bg-blue-500 text-white p-3 rounded-2xl rounded-tr-none shadow-sm text-sm max-w-[85%] leading-relaxed">
                        ${text}
                    </div>
                </div>
            `;
            
            // 入力欄を空にして、一番下までスクロール
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // AIの返答（今は仮のメッセージ。後で本物のAPIに繋ぎます！）
            setTimeout(() => {
                const aiReply = `「${text}」についてだね！いい視点だと思う。まずは二酸化炭素（CO2）がどうやって増えているか調べてみると、もっと分かりやすくまとめられるかもしれないよ。`;
                chatBox.innerHTML += `
                    <div class="flex gap-3 mt-1">
                        <div class="w-8 h-8 rounded-full bg-indigo-500 flex items-center justify-center text-white shrink-0 shadow-sm">
                            <i class="fa-solid fa-robot text-sm"></i>
                        </div>
                        <div class="bg-white border border-slate-200 p-3 rounded-2xl rounded-tl-none shadow-sm text-sm text-slate-700 max-w-[85%] leading-relaxed">
                            ${aiReply}
                        </div>
                    </div>
                `;
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 1000);
        }

        // Enterキーでも送信できるようにする
        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
