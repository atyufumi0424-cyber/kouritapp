<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase 設定
    const firebaseConfig = {
      apiKey: "AIzaSyC8nYLbZ0MNbnC_hfJ9uJirlaYGWnOMSBY",
      authDomain: "kouritsuapp-f4431.firebaseapp.com",
      projectId: "kouritsuapp-f4431",
      storageBucket: "kouritsuapp-f4431.firebasestorage.app",
      messagingSenderId: "1006332335773",
      appId: "1:1006332335773:web:48c1fce80f67a099426674",
      measurementId: "G-S2YZN1CWLF"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();
    provider.addScope('https://www.googleapis.com/auth/drive.file');
    provider.addScope('https://www.googleapis.com/auth/documents');
    provider.addScope('https://www.googleapis.com/auth/spreadsheets');

    const loginBtn = document.getElementById('login-btn') || document.querySelector('button');
    const loginBadge = document.getElementById('login-badge');
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');
    const chatHistory = document.getElementById('chat-history');
    const iframe = document.getElementById('workspace-frame');
    const docsEmbedUrl = "https://docs.google.com/document/create?embedded=true";

    // ログイン状態のリアルタイム監視（画面表示切替）
    onAuthStateChanged(auth, (user) => {
      if (user) {
        console.log("ログイン成功:", user.displayName);
        if (loginBtn) {
          loginBtn.innerText = '✓ Google連携済み';
          loginBtn.className = 'px-4 py-2 text-sm font-medium text-green-700 bg-green-100 rounded-lg border border-green-300 flex items-center gap-2 shadow-sm pointer-events-none';
        }
        if (loginBadge) loginBadge.classList.remove('hidden');
        if (iframe && (!iframe.src || iframe.src === 'about:blank' || iframe.src.includes('github.io'))) {
          iframe.src = docsEmbedUrl;
        }
      }
    });

    // ポップアップ方式でGoogleログインを実行
    if (loginBtn) {
      loginBtn.onclick = async () => {
        try {
          await signInWithPopup(auth, provider);
        } catch (error) {
          console.error("ログインエラー:", error);
        }
      };
    }

    // AIチャット送信処理
    chatForm?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = chatInput.value.trim();
      if (!message) return;

      appendMessage(message, 'user');
      chatInput.value = '';

      try {
        const res = await fetch('https://kouritapp.onrender.com/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'AIサーバーでエラーが発生しました');
        
        appendMessage(data.reply || "応答を取得できませんでした。", 'ai');

        if (auth.currentUser) {
          await addDoc(collection(db, "tasks"), {
            uid: auth.currentUser.uid,
            prompt: message,
            reply: data.reply,
            createdAt: serverTimestamp()
          });
        }
      } catch (err) {
        console.error("API Error:", err);
        appendMessage(`通信エラー: ${err.message}`, 'ai');
      }
    });

    function appendMessage(text, sender) {
      const isUser = sender === 'user';
      const wrapper = document.createElement('div');
      wrapper.className = `flex flex-col items-${isUser ? 'end' : 'start'}`;
      
      const msgDiv = document.createElement('div');
      msgDiv.className = `max-w-[85%] p-3.5 text-sm leading-relaxed rounded-2xl ${
        isUser 
          ? 'bg-indigo-600 text-white rounded-tr-none shadow-sm shadow-indigo-100' 
          : 'bg-indigo-50 text-indigo-900 border border-indigo-100 rounded-tl-none'
      }`;
      msgDiv.textContent = text;
      
      wrapper.appendChild(msgDiv);
      chatHistory.appendChild(wrapper);
      chatHistory.scrollTop = chatHistory.scrollHeight;
    }
  </script>

</body>
</html>
