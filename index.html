<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Workspace Copilot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      overflow: hidden;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex flex-col">

  <!-- ヘッダー -->
  <header class="bg-white border-b border-slate-200 px-6 py-3 flex justify-between items-center shrink-0 shadow-sm">
    <div class="flex items-center space-x-3">
      <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold text-lg">
        🤖
      </div>
      <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-purple-600">
        AI Workspace Copilot
      </h1>
    </div>
    <div id="auth-status" class="flex items-center gap-3">
      <button id="login-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-4 py-2 rounded-lg font-medium transition-colors">
        Googleで連携する
      </button>
      <span id="login-badge" class="hidden text-xs bg-emerald-100 text-emerald-700 px-3 py-1.5 rounded-full font-medium flex items-center gap-1">
        ✓ Google連携済み
      </span>
    </div>
  </header>

  <!-- メインコンテンツ（全画面左右分割） -->
  <main class="flex-1 flex overflow-hidden p-3 gap-3">
    
    <!-- 左パネル：お題 ＋ 作業スペース（70%） -->
    <section class="w-7/10 flex flex-col bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden flex-1">
      
      <!-- お題ヘッダー -->
      <div class="p-4 bg-slate-50/80 border-b border-slate-200 shrink-0 flex justify-between items-center">
        <div>
          <span class="text-xs font-semibold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded">
            今日のお題
          </span>
          <h2 id="topic-title" class="text-base font-bold text-slate-800 mt-1">
            AIを使った未来の学校のアイデアを考えよう
          </h2>
        </div>
        <div class="text-xs text-slate-500 bg-white border border-slate-200 px-2.5 py-1 rounded-md">
          指定ツール: <span id="tool-name" class="font-semibold text-slate-700">Google Docs</span>
        </div>
      </div>

      <!-- 作業スペース（Google Docs / Sheets 埋め込み） -->
      <div class="flex-1 relative bg-slate-100">
        <iframe 
          id="workspace-frame"
          src="" 
          class="w-full h-full border-0"
          allow="autoplay"
        ></iframe>
      </div>

    </section>

    <!-- 右パネル：AI メンター チャット（30%） -->
    <section class="w-3/10 flex flex-col bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden min-w-[320px]">
      
      <!-- チャットヘッダー -->
      <div class="p-3.5 bg-slate-50/80 border-b border-slate-200 shrink-0 flex items-center justify-between">
        <h3 class="font-bold text-slate-700 text-sm flex items-center gap-2">
          💡 AI メンター チャット
        </h3>
      </div>

      <!-- チャット履歴エリア -->
      <div id="chat-history" class="flex-1 p-4 overflow-y-auto space-y-3 bg-slate-50/30">
        <div class="flex flex-col items-start">
          <div class="max-w-[85%] bg-indigo-50 text-indigo-900 border border-indigo-100 rounded-2xl rounded-tl-none p-3 text-sm leading-relaxed">
            こんにちは！今日のお題について分からないことやアイデアの相談があれば何でも聞いてね！
          </div>
        </div>
      </div>

      <!-- メッセージ入力エリア -->
      <div class="p-3 bg-white border-t border-slate-200 shrink-0">
        <form id="chat-form" class="flex gap-2">
          <input 
            type="text" 
            id="chat-input"
            placeholder="AIに質問してみよう..."
            class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
          >
          <button 
            type="submit"
            class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2 rounded-lg text-sm transition-colors shrink-0 flex items-center justify-center"
          >
            送信
          </button>
        </form>
      </div>

    </section>

  </main>

  <!-- Firebase & アプリケーションスクリプト -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase 設定（環境に合わせて保持）
    const firebaseConfig = {
    apiKey: "AIzaSyAS6jKvmRaEMyrobj3kFTHLdxlw1zWsKdQ",
  authDomain: "kouritsuapp-f4431.firebaseapp.com",
  projectId: "kouritsuapp-f4431",
  storageBucket: "kouritsuapp-f4431.firebasestorage.app",
  messagingSenderId: "1006332335773",
  appId: "1:1006332335773:web:48c1fce80f67a099426674",
  measurementId: "G-S2YZN1CWLF"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // OAuth スコープの定義
    provider.addScope('https://www.googleapis.com/auth/drive.file');
    provider.addScope('https://www.googleapis.com/auth/documents');
    provider.addScope('https://www.googleapis.com/auth/spreadsheets');

    const loginBtn = document.getElementById('login-btn');
    const loginBadge = document.getElementById('login-badge');
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');
    const chatHistory = document.getElementById('chat-history');
    const iframe = document.getElementById('workspace-frame');

    // Google Auth ログイン処理
    loginBtn?.addEventListener('click', async () => {
      try {
        const result = await signInWithPopup(auth, provider);
        const credential = GoogleAuthProvider.credentialFromResult(result);
        const token = credential?.accessToken;

        if (token) {
          // デフォルト表示としてGoogle Docs新規ドキュメント等の表示を設定
          iframe.src = `https://docs.google.com/document/u/0/?t=${Date.now()}`;
        }
      } catch (error) {
        console.error("ログインエラー:", error);
      }
    });

    // ログイン状態監視
    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginBtn?.classList.add('hidden');
        loginBadge?.classList.remove('hidden');
        if (!iframe.src || iframe.src === 'about:blank') {
          iframe.src = `https://docs.google.com/document/u/0/?t=${Date.now()}`;
        }
      } else {
        loginBtn?.classList.remove('hidden');
        loginBadge?.classList.add('hidden');
      }
    });

    // チャット送信処理 ＆ Renderバックエンド通信
    chatForm?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = chatInput.value.trim();
      if (!message) return;

      // ユーザーメッセージ表示
      appendMessage(message, 'user');
      chatInput.value = '';

      try {
        // RenderバックエンドへAIリクエスト送信
        const res = await fetch('https://kouritapp.onrender.com/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message })
        });
        const data = await res.json();
        
        // AIの返答を表示
        appendMessage(data.reply || "応答を取得できませんでした。", 'ai');

        // Firestoreにログ保存
        if (auth.currentUser) {
          await addDoc(collection(db, "tasks"), {
            uid: auth.currentUser.uid,
            prompt: message,
            reply: data.reply,
            createdAt: serverTimestamp()
          });
        }
      } catch (err) {
        console.error("Chat API Error:", err);
        appendMessage("通信エラーが発生しました。", 'ai');
      }
    });

    function appendMessage(text, sender) {
      const isUser = sender === 'user';
      const wrapper = document.createElement('div');
      wrapper.className = `flex flex-col items-${isUser ? 'end' : 'start'}`;
      
      const msgDiv = document.createElement('div');
      msgDiv.className = `max-w-[85%] p-3 text-sm leading-relaxed rounded-2xl ${
        isUser 
          ? 'bg-indigo-600 text-white rounded-tr-none' 
          : 'bg-indigo-50 text-indigo-900 border border-indigo-100 rounded-tl-none'
      }`;
      msgDiv.textContent = text;

      wrapper.appendChild(msgDiv);
      chatHistory.appendChild(wrapper);
      chatHistory.scrollTop = chatHistory.scrollHeight;
    }
  </script>

</body>
</html>
