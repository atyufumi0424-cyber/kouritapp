<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kouritapp - 学習サポート</title>
    <style>
        /* 画面全体のレイアウト */
        body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; background: #f0f4f8; }
        
        /* 左側（タスク＆ツール画面） */
        .left-panel { flex: 1; padding: 20px; border-right: 1px solid #ccc; display: flex; flex-direction: column; }
        .task-box { background: #e1f5fe; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 5px solid #0288d1; }
        .task-box h3 { margin-top: 0; color: #01579b; }
        .tool-area { flex: 1; border: 1px solid #ccc; border-radius: 8px; padding: 10px; background: #fff; resize: none; font-size: 16px; }
        
        /* 右側（AIチャット画面） */
        .right-panel { width: 350px; padding: 20px; background: #fff; display: flex; flex-direction: column; }
        .chat-box { flex: 1; overflow-y: auto; border: 1px solid #eee; padding: 10px; margin-bottom: 10px; border-radius: 8px; background: #fafafa; display: flex; flex-direction: column; }
        .chat-message { margin-bottom: 10px; padding: 10px; border-radius: 8px; max-width: 85%; font-size: 0.9em; line-height: 1.4; }
        .user-msg { background: #dcf8c6; align-self: flex-end; }
        .ai-msg { background: #e3f2fd; align-self: flex-start; }
        
        /* 入力エリア */
        .input-area { display: flex; gap: 5px; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

    <!-- 左側：作業エリア -->
    <div class="left-panel">
        <div class="task-box">
            <h3>📝 先生からのタスク</h3>
            <p>今日の目標：地球温暖化の原因について調べ、右側のAIと相談しながら、自分の言葉で下のノートにまとめましょう。</p>
        </div>
        <h4>作業用ノート（指定ツール）</h4>
        <textarea class="tool-area" placeholder="ここに調べたことや考えたことを書いてみよう..."></textarea>
    </div>

    <!-- 右側：AIチャットエリア -->
    <div class="right-panel">
        <h3 style="margin-top:0;">🤖 AIアシスタント</h3>
        <div class="chat-box" id="chatBox">
            <div class="chat-message ai-msg">こんにちは！今日のタスクで分からないことや、アイデアが欲しい時はなんでも聞いてね。</div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="AIに質問する..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">送信</button>
        </div>
    </div>

    <script>
        // チャット送信機能
        function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            const chatBox = document.getElementById('chatBox');
            
            // ユーザーの入力テキストを画面に追加
            chatBox.innerHTML += `<div class="chat-message user-msg">${text}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight; // 一番下へスクロール

            // AIの返答（※今は仮の動きです。後で本物のAIを繋ぎます）
            setTimeout(() => {
                const aiReply = `「${text}」についてだね！いい視点だと思う。ヒントとして、〇〇について調べてみるともっと深まるかもしれないよ。`;
                chatBox.innerHTML += `<div class="chat-message ai-msg">${aiReply}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 1000); // 1秒後に返信
        }

        // Enterキーで送信できる機能
        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
